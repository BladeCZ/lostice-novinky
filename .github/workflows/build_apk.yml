name: Sestavení Android aplikace (APK)

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (předinstalován na runneru)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Sestavení APK
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/LosticeNovinky.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LosticeNovinky-APK
          path: android/dist/LosticeNovinky.apk
          retention-days: 90

      - name: Nahrání APK do GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view apk-latest >/dev/null 2>&1; then
            gh release create apk-latest --title "Android aplikace Loštice novinky" --notes "Automaticky sestavená aplikace (.apk): hlášení městského rozhlasu, usnesení rady a zastupitelstva města Loštice."
          fi
          gh release upload apk-latest android/dist/LosticeNovinky.apk --clobber
