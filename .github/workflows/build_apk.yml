name: SestavenĂ­ Android aplikace (APK)

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: SestavenĂ­ APK
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/LosticeNovinky.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LosticeNovinky-APK
          path: android/dist/LosticeNovinky.apk
          retention-days: 90

      - name: NahrĂˇnĂ­ APK do GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view apk-latest >/dev/null 2>&1; then
            gh release create apk-latest --title "Android aplikace LoĹˇtice novinky" --notes "Automaticky sestavenĂˇ aplikace (.apk): hlĂˇĹˇenĂ­ mÄ›stskĂ©ho rozhlasu, usnesenĂ­ rady a zastupitelstva mÄ›sta LoĹˇtice."
          fi
          gh release upload apk-latest android/dist/LosticeNovinky.apk --clobber
