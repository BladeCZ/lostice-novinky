<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d3b66">
<title>Loštice novinky</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <button id="back" hidden aria-label="Zpět">←</button>
  <h1 id="title">Loštice novinky</h1>
  <button id="mark-all-read" aria-label="Přečíst vše" title="Označit vše jako přečtené">✓✓</button>
  <button id="refresh" aria-label="Obnovit" title="Obnovit">⟳</button>
</header>

<main id="list-view"><div id="list"></div></main>

<main id="detail-view" hidden>
  <div class="panel">
    <div id="controls-reading">
      <div class="row">
        <span>Velikost textu</span>
        <button id="font-minus">−</button>
        <b id="font-val">100 %</b>
        <button id="font-plus">+</button>
      </div>
      <div class="row">
        <span>Rychlost čtení</span>
        <button id="rate-minus">−</button>
        <b id="rate-val">1.0×</b>
        <button id="rate-plus">+</button>
      </div>
      <button id="speak" class="primary">▶ Přečíst nahlas</button>
    </div>

    <!-- Tlačítka pro Hlas Loštic -->
    <div id="controls-hlas" hidden>
      <div style="font-weight:700;color:var(--p);margin-bottom:6px">📖 Čtení časopisu v telefonu:</div>
      <a id="btn-a5" class="primary btn-link" target="_blank" rel="noopener">📄 Číst A5 na výšku</a>
    </div>

    <div style="margin-top:6px">
      <a id="pdf" class="pdf-btn" target="_blank" rel="noopener">Původní PDF</a>
    </div>
  </div>

  <div id="sub-tabs" class="sub-tabs" hidden>
    <button id="tab-summary" class="active">📌 Přehled usnesení</button>
    <button id="tab-full">📄 Celé znění</button>
  </div>

  <!-- Vyhledávací lišta pro usnesení -->
  <div id="search-box" class="search-box" hidden>
    <input type="text" id="search-input" placeholder="Hledat v usnesení (např. dotace, odpad, 90/2339)...">
  </div>

  <!-- Rychlé scrollování mezi body -->
  <div id="jump-bar" class="jump-bar" hidden></div>

  <article id="detail-article">
    <div id="d-date"></div>
    <div id="d-content"></div>
  </article>
</main>

<nav>
  <button data-tab="aktuality" class="active"><span class="nav-icon-wrap">📰<span class="nav-badge" id="badge-aktuality" hidden></span></span><span>Aktuality</span></button>
  <button data-tab="hlaseni"><span class="nav-icon-wrap">📢<span class="nav-badge" id="badge-hlaseni" hidden></span></span><span>Rozhlas</span></button>
  <button data-tab="rm"><span class="nav-icon-wrap">🏛️<span class="nav-badge" id="badge-rm" hidden></span></span><span>Rada</span></button>
  <button data-tab="zm"><span class="nav-icon-wrap">👥<span class="nav-badge" id="badge-zm" hidden></span></span><span>Zastupitelstvo</span></button>
  <button data-tab="hlas"><span class="nav-icon-wrap">📖<span class="nav-badge" id="badge-hlas" hidden></span></span><span>Zpravodaj</span></button>
</nav>

<script src="app.js"></script>
</body>
</html>
